services:
  database:
    image: ghcr.io/stac-utils/pgstac-postgres:v0.9.12@sha256:0822287990ae8c0d200eb7143b320d02157bd1da0500cc1b0957603a603896c6
    restart: unless-stopped
    environment:
      - "POSTGRES_USER=eolab"
      # Reject an unset or blank database password before any containers start.
      - "POSTGRES_PASSWORD=${EOLAB_DATABASE_PASSWORD:?EOLAB_DATABASE_PASSWORD must be set}"
      - "POSTGRES_DB=eolab"
      - "PGUSER=eolab"
      - "PGPASSWORD=${EOLAB_DATABASE_PASSWORD:?EOLAB_DATABASE_PASSWORD must be set}"
      - "PGDATABASE=eolab"
    expose:
      - "5432"
    volumes:
      - pgstac-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U eolab -d eolab
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Initializes pgSTAC in a new database and applies schema upgrades thereafter.
  pgstac-migrate:
    build:
      context: .
      dockerfile: Dockerfile.catalog-migrate
    restart: "no"
    environment:
      - "PGUSER=eolab"
      - "PGPASSWORD=${EOLAB_DATABASE_PASSWORD:?EOLAB_DATABASE_PASSWORD must be set}"
      - "PGDATABASE=eolab"
      - "PGHOST=database"
      - "PGPORT=5432"
    depends_on:
      database:
        condition: service_healthy

  stac-api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:6.3.1@sha256:db117b91302f7983ce4e07658768a6e8d2f6716613252a15f5dcdbda8dae9883
    restart: unless-stopped
    environment:
      - "PGUSER=eolab"
      - "PGPASSWORD=${EOLAB_DATABASE_PASSWORD:?EOLAB_DATABASE_PASSWORD must be set}"
      - "PGDATABASE=eolab"
      - "PGHOST=database"
      - "PGPORT=5432"
      - "DB_MIN_CONN_SIZE=1"
      - "DB_MAX_CONN_SIZE=5"
      - "ROOT_PATH=/stac"
      - "ENABLE_TRANSACTIONS_EXTENSIONS=TRUE"
      - "STAC_FASTAPI_TITLE=EOLab STAC API"
      - "STAC_FASTAPI_DESCRIPTION=Searchable geospatial assets registered with EOLab"
      - "STAC_FASTAPI_LANDING_ID=eolab-stac"
    expose:
      - "8080"
    depends_on:
      pgstac-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_mgmt/health', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  geoserver:
    build:
      context: .
      dockerfile: Dockerfile.geoserver
    cpus: ${EOLAB_GEOSERVER_CPU_LIMIT:-4}
    restart: unless-stopped
    environment:
      - "SKIP_DEMO_DATA=true"
      - "RUN_UNPRIVILEGED=true"
      - "WEBAPP_CONTEXT=geoserver"
      - "ROOT_WEBAPP_REDIRECT=false"
      - "CORS_ENABLED=false"
      - "JSONP_ENABLED=false"
      - "INSTALL_EXTENSIONS=false"
      - "JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError"
      - "GEOSERVER_MAX_HEAP_SIZE=${EOLAB_GEOSERVER_MAX_HEAP_SIZE:-4g}"
      - "GEOSERVER_WMS_RENDER_COUNT=${EOLAB_GEOSERVER_WMS_RENDER_COUNT:-2}"
      - "GEOSERVER_GWC_REQUEST_COUNT=${EOLAB_GEOSERVER_GWC_REQUEST_COUNT:-8}"
      - "GEOSERVER_WMS_QUEUE_TIMEOUT_SECONDS=${EOLAB_GEOSERVER_WMS_QUEUE_TIMEOUT_SECONDS:-10}"
      - "GEOWEBCACHE_CACHE_DIR=/opt/geoserver_data/gwc-cache"
      - "PROXY_BASE_URL=$${X-Forwarded-Proto}://$${X-Forwarded-Host}/geoserver http://geoserver:8080/geoserver"
      - "PROXY_BASE_URL_HEADERS=true"
      - "GEOSERVER_ADMIN_USER=eolab"
      - "GEOSERVER_ADMIN_PASSWORD=${EOLAB_GEOSERVER_ADMIN_PASSWORD:?EOLAB_GEOSERVER_ADMIN_PASSWORD must be set}"
    expose:
      - "8080"
      # The JVM metrics endpoint is available only on this Compose network.
      - "9404"
    volumes:
      - geoserver-data:/opt/geoserver_data
      # GeoServer also verifies at startup that /scan-source is read-only.
      - type: bind
        source: ${EOLAB_SCAN_MOUNT_PATH}
        target: /scan-source
        read_only: true
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --output
        - /dev/null
        - http://127.0.0.1:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  geoserver-init:
    build:
      context: .
      dockerfile: Dockerfile.geoserver-init
    restart: "no"
    environment:
      - "GEOSERVER_INTERNAL_URL=http://geoserver:8080/geoserver"
      - "GEOSERVER_ADMIN_USER=eolab"
      - "GEOSERVER_ADMIN_PASSWORD=${EOLAB_GEOSERVER_ADMIN_PASSWORD:?EOLAB_GEOSERVER_ADMIN_PASSWORD must be set}"
      - "GEOSERVER_MASTER_PASSWORD=${EOLAB_GEOSERVER_MASTER_PASSWORD:?EOLAB_GEOSERVER_MASTER_PASSWORD must be set}"
      - "GEOWEBCACHE_DISK_QUOTA_GIB=${EOLAB_GEOWEBCACHE_DISK_QUOTA_GIB:-25}"
    depends_on:
      geoserver:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Processing owns its schema migration and runs independently of HTTP/WMS.
  # The shared database arbitrates one global active attempt across deployments.
  processing-worker:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?SOURCE_COMMIT must identify the source revision}
    restart: unless-stopped
    command: ["python", "-m", "eolab_app.main", "processing-worker"]
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 64
    stop_grace_period: 20s
    environment:
      - "CATALOG_INTERNAL_URL=http://stac-api:8080"
      - "SCAN_MOUNT_PATH=/scan-source"
      - "PROCESSING_DATA_PATH=/processing-data"
      - "PGHOST=database"
      - "PGPORT=5432"
      - "PGDATABASE=eolab"
      - "PGUSER=eolab"
      - "PGPASSWORD=${EOLAB_DATABASE_PASSWORD:?EOLAB_DATABASE_PASSWORD must be set}"
      - "OPENBLAS_NUM_THREADS=1"
      - "OMP_NUM_THREADS=2"
    volumes:
      - processing-data:/processing-data
      - type: bind
        source: ${EOLAB_SCAN_MOUNT_PATH}
        target: /scan-source
        read_only: true
    depends_on:
      database:
        condition: service_healthy
    # This is a queue consumer, not a Uvicorn server.
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Independent executor; installed outline work reads Catalog and the scan mount.
  jobs:
    build:
      context: .
      dockerfile: services/jobs/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      # The same EOLab credential is supplied to the app below.
      JOBS_CALLERS: '{"eolab":"${EOLAB_JOBS_TOKEN-}"}'
      JOBS_QUEUE_CAPACITY: ${EOLAB_JOBS_QUEUE_CAPACITY-32}
      JOBS_RECORD_CAPACITY: ${EOLAB_JOBS_RECORD_CAPACITY-128}
      JOBS_RETENTION_SECONDS: ${EOLAB_JOBS_RETENTION_SECONDS-3600}
      JOBS_EXECUTION_TIMEOUT_SECONDS: ${EOLAB_JOBS_EXECUTION_TIMEOUT_SECONDS-60}
      JOBS_QUEUE_TIMEOUT_SECONDS: ${EOLAB_JOBS_QUEUE_TIMEOUT_SECONDS-60}
      JOBS_MAX_TIMEOUT_SECONDS: ${EOLAB_JOBS_MAX_TIMEOUT_SECONDS-300}
    cpus: 1
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 32
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ${EOLAB_SCAN_MOUNT_PATH}
        target: /scan-source
        read_only: true
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/jobs/health', timeout=3)
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?SOURCE_COMMIT must identify the source revision}
    restart: unless-stopped
    environment:
      - "JOBS_TOKEN=${EOLAB_JOBS_TOKEN-}"
      - "APP_TITLE=${EOLAB_APP_TITLE:-EOLab}"
      - "APP_SUBTITLE=${EOLAB_APP_SUBTITLE:-Explore, visualize, and analyze Earth observation data}"
      - "CATALOG_URL=${EOLAB_CATALOG_URL:-/stac}"
      - "CATALOG_INTERNAL_URL=http://stac-api:8080"
      - "WMS_URL=/geoserver/eolab/wms"
      - "GEOSERVER_INTERNAL_URL=http://geoserver:8080/geoserver"
      - "GEOSERVER_METRICS_INTERNAL_URL=http://geoserver:9404/metrics"
      - "GEOSERVER_WMS_RENDER_COUNT=${EOLAB_GEOSERVER_WMS_RENDER_COUNT:-2}"
      - "COMPOSITE_TILE_CACHE_BYTES=${EOLAB_COMPOSITE_TILE_CACHE_BYTES:-134217728}"
      - "RASTER_PIXEL_READ_CONCURRENCY=${EOLAB_RASTER_PIXEL_READ_CONCURRENCY:-2}"
      - "RASTER_STATISTICS_READ_CONCURRENCY=${EOLAB_RASTER_STATISTICS_READ_CONCURRENCY:-1}"
      - "RASTER_STATISTICS_CACHE_ENTRIES=${EOLAB_RASTER_STATISTICS_CACHE_ENTRIES:-32}"
      - "GEOSERVER_ADMIN_USER=eolab"
      - "GEOSERVER_ADMIN_PASSWORD=${EOLAB_GEOSERVER_ADMIN_PASSWORD:?EOLAB_GEOSERVER_ADMIN_PASSWORD must be set}"
      - "PGHOST=database"
      - "PGPORT=5432"
      - "PGDATABASE=eolab"
      - "PGUSER=eolab"
      - "PGPASSWORD=${EOLAB_DATABASE_PASSWORD:?EOLAB_DATABASE_PASSWORD must be set}"
      - "SCAN_MOUNT_PATH=/scan-source"
      - "SCAN_PATHS_WITHIN_MOUNT=${EOLAB_SCAN_PATHS_WITHIN_MOUNT:?EOLAB_SCAN_PATHS_WITHIN_MOUNT must be a JSON array}"
      - "SCAN_DISPLAY_PATH_PREFIX=${EOLAB_SCAN_DISPLAY_PATH_PREFIX:?EOLAB_SCAN_DISPLAY_PATH_PREFIX must be set}"
      - "SCAN_WORKER_COUNT=${EOLAB_SCAN_WORKER_COUNT:-8}"
      - "SCAN_WRITER_COUNT=${EOLAB_SCAN_WRITER_COUNT:-4}"
      - "SCAN_BATCH_SIZE=${EOLAB_SCAN_BATCH_SIZE:-100}"
      - "SCAN_ERROR_DETAIL_LIMIT=${EOLAB_SCAN_ERROR_DETAIL_LIMIT:-100}"
      - "SCAN_RECONCILIATION_PAGE_SIZE=${EOLAB_SCAN_RECONCILIATION_PAGE_SIZE:-500}"
      - "SCAN_RECONCILIATION_CONCURRENCY=${EOLAB_SCAN_RECONCILIATION_CONCURRENCY:-8}"
      - "SCAN_RECONCILIATION_SPOOL_MEMORY_BYTES=${EOLAB_SCAN_RECONCILIATION_SPOOL_MEMORY_BYTES:-1048576}"
      - "SCAN_CATALOG_WRITE_TIMEOUT_SECONDS=${EOLAB_SCAN_CATALOG_WRITE_TIMEOUT_SECONDS:-120}"
      - "SCAN_CATALOG_ERROR_DETAIL_LIMIT=${EOLAB_SCAN_CATALOG_ERROR_DETAIL_LIMIT:-500}"
      - "PROCESSING_DATA_PATH=/processing-data"
      - "BASEMAP_URL=${EOLAB_BASEMAP_URL:-https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png}"
      - "BASEMAP_ATTRIBUTION=${EOLAB_BASEMAP_ATTRIBUTION:-Map data: &copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap contributors</a>, SRTM | Map style: &copy; <a href='https://opentopomap.org'>OpenTopoMap</a> (<a href='https://creativecommons.org/licenses/by-sa/3.0/'>CC-BY-SA</a>)}"
      - "INITIAL_LATITUDE=${EOLAB_INITIAL_LATITUDE:-20}"
      - "INITIAL_LONGITUDE=${EOLAB_INITIAL_LONGITUDE:-0}"
      - "INITIAL_ZOOM=${EOLAB_INITIAL_ZOOM:-2}"
    expose:
      - "8000"
    volumes:
      - processing-data:/processing-data:ro
      # Primary container-level protection. The image also verifies the
      # effective kernel mount mode at startup in case deployment metadata
      # reports or requests this bind as writable.
      - type: bind
        source: ${EOLAB_SCAN_MOUNT_PATH}
        target: /scan-source
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # Use a predictable name so the database volume is easy to identify and delete.
  pgstac-data:
    name: ${EOLAB_DATABASE_VOLUME_NAME:-eolab-pgstac-data}
  geoserver-data:
    name: ${EOLAB_GEOSERVER_DATA_VOLUME_NAME:-eolab-geoserver-data}
  processing-data:
    name: ${EOLAB_PROCESSING_DATA_VOLUME_NAME:-eolab-processing-data}
