# Temporary workaround for a GeoTools 35.1 bug, not an EOlab projection choice.
# GeoTools lacks the "Lambert Cylindrical Equal Area" operation name used by EPSG:6933.
# Use its equivalent "Cylindrical_Equal_Area" name with unchanged ellipsoid and parameters.
# Remove this override once the installed GeoTools resolves EPSG:6933 without it.
# https://github.com/springinnovate/eolab/issues/1002
6933=PROJCS["WGS 84 / NSIDC EASE-Grid 2.0 Global",GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS 84",6378137,298.257223563,AUTHORITY["EPSG","7030"]],AUTHORITY["EPSG","6326"]],PRIMEM["Greenwich",0,AUTHORITY["EPSG","8901"]],UNIT["degree",0.0174532925199433,AUTHORITY["EPSG","9122"]],AUTHORITY["EPSG","4326"]],PROJECTION["Cylindrical_Equal_Area"],PARAMETER["standard_parallel_1",30],PARAMETER["central_meridian",0],PARAMETER["false_easting",0],PARAMETER["false_northing",0],UNIT["metre",1,AUTHORITY["EPSG","9001"]],AXIS["Easting",EAST],AXIS["Northing",NORTH],AUTHORITY["EPSG","6933"]]
