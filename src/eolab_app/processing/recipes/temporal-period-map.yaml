schema: eolab.model/v1
id: temporal-period-map
version: "1.0.0"
title: Create a raster from a time series
description: Calculate a statistic over observations or total precipitation for a period. Ordinary statistics give observations equal weight and retain source units without integration. Results include valid-observation counts; gaps remain missing. Precipitation totals require whole UTC hours.
inputs:
  source:
    type: temporal_interval
    label: Dataset and period
  area:
    type: summary_area
    label: Analysis area
  reduction:
    type: temporal_reduction
    label: Statistic
parameters: {}
steps:
  - id: calculate
    operation: temporal.reduce.v1
    inputs:
      source: {input: source}
      area: {input: area}
      reduction: {input: reduction}
      precipitation:
        value:
          inputUnit: "kg m**-2 s**-1"
          outputUnit: mm
          # Total = sum(rate * interval seconds * factor).
          factor: 1
    parameters: {}
outputs:
  raster:
    type: raster
    label: Period map
    source: calculate.raster
    role: result
    presentation: map
    saveEligible: true
  count:
    type: raster
    label: Valid observation count
    source: calculate.count
    role: result
    presentation: map
    saveEligible: true
executionProfile: temporal-period-map
