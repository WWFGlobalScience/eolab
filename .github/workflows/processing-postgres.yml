name: Processing PostgreSQL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks for changed files
        id: changes
        shell: bash
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/select_ci_checks.py --event "$CI_EVENT" \
            --base "$CI_BASE" --head "$CI_HEAD" | tee "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.processing == 'true'
        with:
          python-version: '3.12'
      - name: Real database suites and disposable lifecycle verification
        if: steps.changes.outputs.processing == 'true'
        run: python scripts/verify_processing_postgres.py
      - name: No Processing database tests needed for these changes
        if: steps.changes.outputs.processing == 'false'
        run: echo 'No Processing database inputs changed.'
